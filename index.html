
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b16">
<title>JARVIS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b16;color:#65e7ff;font-family:Arial,sans-serif;text-align:center;padding:20px}
h1{letter-spacing:6px;margin-top:35px}
p{color:#a6cce0}
.core{width:210px;height:210px;border:3px solid #36caff;border-radius:50%;margin:35px auto;display:grid;place-items:center;box-shadow:0 0 35px #168bff;animation:girar 8s linear infinite}
.nucleo{width:85px;height:85px;border-radius:50%;background:radial-gradient(white,#38cfff,#0755a0);box-shadow:0 0 35px #38cfff}
@keyframes girar{to{transform:rotate(360deg)}}
button,input{font-size:16px;padding:14px;border-radius:10px;margin:6px}
button{background:#083454;border:1px solid #36caff;color:white}
input{width:65%;background:#0b1d30;color:white;border:1px solid #36caff}
#resposta{color:white;line-height:1.6;min-height:50px}
</style>
</head>
<body>
<h1>J.A.R.V.I.S.</h1>
<p>ASSISTENTE PESSOAL</p>
<div class="core"><div class="nucleo"></div></div>
<h2 id="estado">SISTEMA PRONTO</h2>
<h2 id="hora"></h2>
<p id="resposta">Olá! Sou o JARVIS. Como posso ajudar?</p>
<input id="texto" placeholder="Digite ou fale comigo">
<button onclick="enviar()">ENVIAR</button>
<br>
<button onclick="ouvir()">🎙️ FALAR COM JARVIS</button>
<script>
function atualizar(){
document.getElementById("hora").textContent=
new Date().toLocaleTimeString("pt-BR");
}
setInterval(atualizar,1000);atualizar();

function falar(t){
document.getElementById("resposta").textContent=t;
if("speechSynthesis" in window){
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(t);
u.lang="pt-BR";speechSynthesis.speak(u);
}}
function enviar(){
let campo=document.getElementById("texto");
let t=campo.value.trim().toLowerCase();
if(!t)return;
let r;
if(t.includes("oi")||t.includes("olá"))r="Olá! JARVIS operacional. Como posso ajudar?";
else if(t.includes("hora"))r="Agora são "+new Date().toLocaleTimeString("pt-BR");
else if(t.includes("data"))r="Hoje é "+new Date().toLocaleDateString("pt-BR");
else if(t.includes("seu nome"))r="Meu nome é JARVIS, seu assistente pessoal.";
else if(t.includes("youtube")){falar("Abrindo o YouTube.");window.open("https://youtube.com","_blank");campo.value="";return;}
else if(t.includes("google")){falar("Abrindo o Google.");window.open("https://google.com","_blank");campo.value="";return;}
else if(t.includes("ajuda"))r="Você pode perguntar as horas, a data ou pedir para abrir o Google e o YouTube.";
else r="Ainda estou aprendendo. Esta versão não está conectada a uma inteligência artificial online.";
falar(r);campo.value="";
}
function ouvir(){
let R=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!R){falar("O reconhecimento de voz não está disponível neste navegador. Tente digitar seu comando.");return;}
let rec=new R();rec.lang="pt-BR";
document.getElementById("estado").textContent="OUVINDO...";
rec.onresult=e=>{
document.getElementById("texto").value=e.results[0][0].transcript;
enviar();
};
rec.onerror=()=>falar("Não consegui ouvir. Verifique a permissão do microfone ou digite.");
rec.onend=()=>document.getElementById("estado").textContent="SISTEMA PRONTO";
try{rec.start();}catch(e){falar("Tente novamente.");}
}
document.getElementById("texto").addEventListener("keydown",e=>{
if(e.key==="Enter")enviar();
});
</script>
</body>
</html>
